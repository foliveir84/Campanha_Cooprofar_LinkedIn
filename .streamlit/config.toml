[global]
darkTheme = true

[theme]
base = "dark"
primaryColor = "#8d3dff"
backgroundColor = "#1a0036"
secondaryBackgroundColor = "#120021"
textColor = "#e0e0e0"
font = "sans serif"

[server]
# Enable static file serving for assets
enableStaticServing = true

[runner]
# Allow running code that accesses file system
magicEnabled = true

# Specify the main entry point file
# This tells Streamlit Cloud which file to run
# The file should be at the project root
